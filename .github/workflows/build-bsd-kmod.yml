name: Build BSD KMOD

on:
  workflow_dispatch:
    inputs:
      freebsd_iso_url:
        description: 'BSD ISO URL (for kernel source download path)'
        required: true
        type: string
      freebsd_version:
        description: 'VM release to boot (e.g., 15.0, 14.1, 13.3). Leave empty for auto-detect.'
        required: false
        type: string
        default: ''
      build_ventoy:
        description: 'Build full Ventoy package after KMOD build'
        type: boolean
        default: true

jobs:
  build-kmod:
    runs-on: ubuntu-latest
    outputs:
      ventoy_version: ${{ steps.save-output.outputs.ventoy_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Auto-detect latest available FreeBSD VM image
        id: vm-release
        run: |
          if [ -n "${{ inputs.freebsd_version }}" ]; then
            echo "release=${{ inputs.freebsd_version }}" >> $GITHUB_OUTPUT
            echo "Using user-specified VM release: ${{ inputs.freebsd_version }}"
            exit 0
          fi

          echo "No version specified, auto-detecting latest FreeBSD VM image ..."

          # Query the vmactions/freebsd-builder releases for available VM images
          TAG=$(curl -sf https://api.github.com/repos/vmactions/freebsd-builder/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" 2>/dev/null || echo "v1.0.9")
          echo "Latest builder tag: $TAG"

          ASSETS=$(curl -sf "https://api.github.com/repos/vmactions/freebsd-builder/releases/tags/$TAG" \
            | python3 -c "import sys,json; [print(a['name']) for a in json.load(sys.stdin)['assets']]" 2>/dev/null || echo "")

          if [ -z "$ASSETS" ]; then
            # Fallback: try known releases
            for R in 15.0 14.1 13.3 13.2; do
              if curl -sfI "https://github.com/vmactions/freebsd-builder/releases/download/$TAG/freebsd-$R.qcow2.zst" >/dev/null 2>&1; then
                echo "release=$R" >> $GITHUB_OUTPUT
                echo "Found VM image via HEAD check: FreeBSD $R"
                exit 0
              fi
            done
          else
            for R in 15.0 14.1 13.3; do
              if echo "$ASSETS" | grep -q "freebsd-$R.qcow2"; then
                echo "release=$R" >> $GITHUB_OUTPUT
                echo "Found VM image via API: FreeBSD $R"
                exit 0
              fi
            done
          fi

          echo "release=14.1" >> $GITHUB_OUTPUT
          echo "Auto-detect failed, using fallback: 14.1"

      - name: Build kernel module in FreeBSD VM
        id: build-vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ steps.vm-release.outputs.release }}
          usesh: true
          sync: rsync
          mem: 4096
          prepare: pkg install -y rsync
          run: |
            set -ex
            REPO_DIR=$(pwd)

            # ============================================================
            # A. Detect BSD version INSIDE the VM (sole source of truth)
            # ============================================================
            echo "========== VM SYSTEM DETECTION =========="
            uname -a
            KERNEL_VER=$(uname -r)
            OSDATE=$(sysctl -n kern.osreldate 2>/dev/null || echo "unknown")
            echo "Kernel release : $KERNEL_VER"
            echo "kern.osreldate: $OSDATE"

            # Map kernel version -> Ventoy source version
            case "$KERNEL_VER" in
              15.*) VV="15.x"; SRC_VER="${KERNEL_VER%-*}" ;;
              14.*) VV="14.x"; SRC_VER="${KERNEL_VER%-*}" ;;
              13.*) VV="13.x"; SRC_VER="${KERNEL_VER%-*}" ;;
              12.*) VV="12.x"; SRC_VER="${KERNEL_VER%-*}" ;;
              11.*) VV="11.x"; SRC_VER="${KERNEL_VER%-*}" ;;
              10.*) VV="10.x"; SRC_VER="${KERNEL_VER%-*}" ;;
              9.*)  VV="9.x";  SRC_VER="${KERNEL_VER%-*}" ;;
              *)
                echo "ERROR: Cannot map kernel '$KERNEL_VER' to Ventoy source"
                exit 1
                ;;
            esac
            echo "Detected Ventoy source version: $VV"
            echo "Source version: $SRC_VER"

            # Detect BSD distribution
            DISTRO="FreeBSD"
            if [ -f /etc/platform ]; then
              DISTRO=$(cat /etc/platform)
            elif [ -f /etc/version ]; then
              DISTRO=$(cat /etc/version | head -1)
            fi
            echo "Distribution: $DISTRO"

            # ============================================================
            # B. Verify Ventoy source exists for this version
            # ============================================================
            VENTOY_SRC_DIR="$REPO_DIR/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/$VV"
            if [ ! -d "$VENTOY_SRC_DIR" ]; then
              echo "ERROR: No Ventoy source for detected version $VV"
              echo "Available:"
              ls "$REPO_DIR/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/"
              exit 1
            fi
            echo "Using Ventoy source: $VENTOY_SRC_DIR"

            # ============================================================
            # C. Install/Download kernel source
            # ============================================================
            install_src_via_pkg() {
              echo "Trying: pkg install -y src"
              pkg install -y src 2>&1 && return 0
              pkg install -y freebsd-source 2>&1 && return 0
              pkg install -y base-source 2>&1 && return 0
              return 1
            }

            download_src_txz() {
              local URL="$1"
              echo "Trying: fetch $URL"
              fetch "$URL" -o /tmp/src.txz 2>/dev/null && {
                cd / && tar xJf /tmp/src.txz
                echo "Source extracted from $URL"
                return 0
              }
              return 1
            }

            echo "========== INSTALLING KERNEL SOURCE =========="

            # Method 1: pkg (most reliable, matches running kernel)
            if [ -f /usr/src/sys/sys/param.h ]; then
              echo "Source already present at /usr/src"
            elif install_src_via_pkg; then
              echo "Source installed via pkg"
            else
              echo "pkg failed, trying to download src.txz..."

              SUCCESS=false

              # From ISO URL's base directory
              ISO_URL="${{ inputs.freebsd_iso_url }}"
              BASE="${ISO_URL%/*}"
              download_src_txz "${BASE}/src.txz" && SUCCESS=true

              # From official snapshot URLs
              if ! $SUCCESS; then
                MAJOR="${SRC_VER%%.*}"
                download_src_txz "https://download.freebsd.org/snapshots/ISO-IMAGES/${MAJOR}/src.txz" && SUCCESS=true
              fi

              # From official release URLs
              if ! $SUCCESS; then
                download_src_txz "https://download.freebsd.org/releases/amd64/${SRC_VER}-RELEASE/src.txz" && SUCCESS=true
                download_src_txz "https://download.freebsd.org/releases/ISO-IMAGES/${SRC_VER}/src.txz" && SUCCESS=true
              fi

              if ! $SUCCESS; then
                echo "ERROR: All source download methods failed!"
                exit 1
              fi
            fi

            if [ ! -d /usr/src/sys/geom ]; then
              echo "ERROR: Kernel source not properly installed at /usr/src/sys"
              ls -la /usr/src/ 2>/dev/null || echo "/usr/src empty"
              exit 1
            fi
            echo "Kernel source ready at /usr/src"

            # ============================================================
            # D. Build geom_ventoy kernel module
            # ============================================================
            echo "========== INSTALLING VENTOY GEOM SOURCE =========="
            cp -r "$VENTOY_SRC_DIR/sys/geom/ventoy" /usr/src/sys/geom/ventoy
            mkdir -p /usr/src/sys/modules/geom/geom_ventoy
            cp "$VENTOY_SRC_DIR/sys/modules/geom/geom_ventoy/Makefile" /usr/src/sys/modules/geom/geom_ventoy/

            echo "========== BUILDING KERNEL MODULE =========="
            cd /usr/src/sys/modules/geom/geom_ventoy
            make -j$(sysctl -n hw.ncpu)

            echo "========== BUILD RESULT =========="
            file geom_ventoy.ko

            # ============================================================
            # E. Install to repo (synced back to host)
            # ============================================================
            echo "========== INSTALLING =========="
            TARGET_DIR="$REPO_DIR/Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/$VV/64"
            mkdir -p "$TARGET_DIR"
            cp geom_ventoy.ko "$TARGET_DIR/"
            cd "$TARGET_DIR"
            xz -zf geom_ventoy.ko
            ls -la "$TARGET_DIR/"

            # Save detected version for host
            echo "$VV" > "$REPO_DIR/Unix/.detected_version"

      - name: Read detected version
        id: save-output
        run: |
          if [ -f Unix/.detected_version ]; then
            VV=$(cat Unix/.detected_version)
            echo "ventoy_version=$VV" >> $GITHUB_OUTPUT
            echo "Detected version from VM: $VV"
          else
            echo "ventoy_version=14.x" >> $GITHUB_OUTPUT
            echo "WARNING: .detected_version not found, using 14.x"
          fi

      - name: Upload KMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: geom_ventoy-${{ steps.save-output.outputs.ventoy_version }}-64.ko.xz
          path: Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ steps.save-output.outputs.ventoy_version }}/64/geom_ventoy.ko.xz

  build-ventoy:
    needs: [build-kmod]
    if: ${{ inputs.build_ventoy == true && !cancelled() && !failure() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download built KMOD
        uses: actions/download-artifact@v4
        with:
          name: geom_ventoy-${{ needs.build-kmod.outputs.ventoy_version }}-64.ko.xz
          path: Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/

      - name: Verify KMOD in place
        run: |
          ls -la Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/
          file Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/geom_ventoy.ko.xz

      - name: Build Ventoy
        run: docker compose up

      - name: Upload Ventoy artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ventoy-build-output
          path: INSTALL/ventoy-*
