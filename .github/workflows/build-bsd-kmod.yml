name: Build BSD KMOD

on:
  workflow_dispatch:
    inputs:
      freebsd_image_url:
        description: BSD ISO or VM image URL (.iso / .qcow2 / .qcow2.xz)
        required: true
        type: string
      build_ventoy:
        description: Build full Ventoy package after KMOD build
        type: boolean
        default: true

jobs:
  build-kmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils expect \
            mtools dosfstools genisoimage xorriso

      - name: Download image
        id: download
        run: |
          URL="${{ inputs.freebsd_image_url }}"
          FILENAME=$(basename "$URL")
          echo "Downloading from: $URL"
          curl -fSLo "$FILENAME" "$URL"
          ls -lh "$FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Detect and prepare image
        id: detect
        run: |
          FILENAME="${{ steps.download.outputs.filename }}"

          if [[ "$FILENAME" == *.xz ]]; then
            echo "=== Decompressing xz ==="
            xz -d "$FILENAME" && FILENAME="${FILENAME%.xz}"
            ls -lh "$FILENAME"
          fi

          FT=$(file "$FILENAME")
          echo "File type: $FT"

          if [[ "$FILENAME" == *.qcow2 ]] || [[ "$FT" == *"QEMU QCOW"* ]]; then
            echo "image_type=qcow2" >> $GITHUB_OUTPUT
            mv "$FILENAME" disk.qcow2
          elif [[ "$FILENAME" == *.img ]] || [[ "$FT" == *"DOS/MBR boot sector"* ]]; then
            echo "image_type=qcow2" >> $GITHUB_OUTPUT
            qemu-img convert -f raw -O qcow2 "$FILENAME" disk.qcow2
            rm -f "$FILENAME"
          elif [[ "$FILENAME" == *.iso ]] || [[ "$FT" == *"ISO 9660"* ]]; then
            echo "image_type=iso" >> $GITHUB_OUTPUT
            mv "$FILENAME" freebsd.iso
          else
            echo "Unknown image type!"; exit 1
          fi
          ls -lh disk.qcow2 2>/dev/null || true

      # ISO path: install FreeBSD
      - name: Create installerconfig
        if: ${{ steps.detect.outputs.image_type == 'iso' }}
        run: |
          F=installerconfig
          echo '#!/bin/sh' > $F
          echo 'set -ex' >> $F
          echo 'exec 1>/dev/tty 2>/dev/tty' >> $F
          echo 'kbdcontrol -L /usr/share/syscons/keymaps/us.kbd' >> $F
          echo 'DISK=$(sysctl -n kern.disks | tr " " "\n" | grep -v -e "^cd" -e "^da" -e "^fd" | head -1)' >> $F
          echo 'bsdinstall autopart ZFS $DISK' >> $F
          echo 'bsdinstall mount /mnt' >> $F
          echo 'bsdinstall distfetch /usr/freebsd-dist' >> $F
          echo 'bsdinstall distextract /mnt' >> $F
          echo 'cat >> /mnt/etc/rc.conf << EOF' >> $F
          echo 'hostname="ventoy-builder"' >> $F
          echo 'ifconfig_vtnet0="DHCP"' >> $F
          echo 'sshd_enable="YES"' >> $F
          echo 'EOF' >> $F
          echo 'echo "autoboot_delay=\"0\"" >> /mnt/boot/loader.conf' >> $F
          echo 'bsdinstall umount /mnt' >> $F
          echo 'zfs umount -a 2>/dev/null || true' >> $F
          echo 'poweroff' >> $F
          chmod +x $F

      - name: Embed installerconfig into ISO
        if: ${{ steps.detect.outputs.image_type == 'iso' }}
        run: |
          mkdir -p iso_orig
          xorriso -osirrox on -indev freebsd.iso -extract / iso_orig/ 2>/dev/null
          cp installerconfig iso_orig/installerconfig
          echo 'installer_config="/installerconfig"' >> iso_orig/boot/loader.conf
          rm -f freebsd_auto.iso
          genisoimage -R -b boot/cdboot -no-emul-boot -boot-load-size 4 \
            -c boot.catalog -V "FREEBSD_AUTO" \
            -o freebsd_auto.iso iso_orig/ 2>&1 | tail -5
          ls -lh freebsd_auto.iso
          qemu-img create -f qcow2 disk.qcow2 12G

      - name: Install FreeBSD from ISO
        if: ${{ steps.detect.outputs.image_type == 'iso' }}
        run: |
          KVM=",accel=kvm"
          [ ! -e /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ] && KVM=",accel=tcg"
          echo "Installing (may take 5-15 min) ..."
          timeout 900 qemu-system-x86_64 \
            -machine pc-q35-4.2${KVM} -m 4096 \
            -cdrom freebsd_auto.iso \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -nic user,model=virtio-net-pci \
            -nographic -no-reboot 2>&1 | tee install.log || true
          tail -5 install.log

      # Data disk with Ventoy source + build script
      - name: Create data disk
        run: |
          dd if=/dev/zero of=data.raw bs=1M count=100
          mkfs.msdos -F 32 data.raw
          for d in Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/*/; do
            ver=$(basename "$d")
            (cd "$d" && tar cf - .) | mcopy -i data.raw - "::/ventoy_src_$ver.tar"
          done

          cat > build.sh << 'BSHEOF'
          #!/bin/sh
          set -ex
          KVER=$(uname -r)
          VV=$(echo $KVER | cut -d. -f1)x
          echo "Kernel: $KVER  Version: $VV"
          if [ ! -d /usr/src/sys ]; then
            dhclient vtnet0
            echo 'nameserver 8.8.8.8' > /etc/resolv.conf
            R=$(uname -r)
            fetch "http://download.freebsd.org/releases/amd64/$R/src.txz" -o /tmp/src.txz 2>/dev/null || \
            fetch "http://download.freebsd.org/snapshots/amd64/$R/src.txz" -o /tmp/src.txz
            cd / && tar xJf /tmp/src.txz
          fi
          cd /tmp && tar xf /mnt/ventoy_src_$VV.tar
          test -d sys/geom/ventoy || { echo "No source for $VV"; ls /mnt/; exit 1; }
          cp -r sys/geom/ventoy /usr/src/sys/geom/ventoy
          mkdir -p /usr/src/sys/modules/geom/geom_ventoy
          cp sys/modules/geom/geom_ventoy/Makefile /usr/src/sys/modules/geom/geom_ventoy/
          cd /usr/src/sys/modules/geom/geom_ventoy
          make -j$(sysctl -n hw.ncpu)
          cp geom_ventoy.ko /mnt/
          xz -zf /mnt/geom_ventoy.ko
          echo "BUILD_DONE"
          BSHEOF
          mcopy -i data.raw build.sh ::/build.sh
          ls -lh data.raw

      # Build via serial console (expect)
      - name: Build kernel module inside VM
        id: build
        run: |
          KVM=",accel=kvm"
          [ ! -e /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ] && KVM=",accel=tcg"

          cat > run.exp << 'EXPEOF'
          set timeout 900
          set kvm [lindex $argv 0]
          spawn qemu-system-x86_64 -machine pc-q35-4.2$kvm -m 4096 \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -drive file=data.raw,format=raw,if=virtio \
            -nic user,model=virtio-net-pci \
            -nographic -no-reboot
          expect { "Autoboot in" { send " "; exp_continue } "OK" { } timeout { exit 1 } }
          send "boot -s\r"
          expect { "#" { } timeout { exit 1 } }
          send "mount -uw /\r"
          expect "#"
          send "for d in nda1 vtbd1 nvd1 da0; do mount -t msdosfs /dev/\$d /mnt 2>/dev/null && echo DISK=\$d && break; done\r"
          expect "#"
          send "sh /mnt/build.sh\r"
          expect "BUILD_DONE" { } timeout { exit 1 }
          send "sync; poweroff\r"
          expect eof
          EXPEOF

          expect run.exp "$KVM"
          echo "Build exit: $?"

      # Extract artifact
      - name: Extract ko from data disk
        run: |
          mcopy -i data.raw ::/geom_ventoy.ko.xz . 2>/dev/null || true
          ls -lh geom_ventoy.ko.xz 2>/dev/null || echo "No .ko found"

      - name: Upload KMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: geom_ventoy-64.ko.xz
          path: geom_ventoy.ko.xz

  build-ventoy:
    needs: [build-kmod]
    if: ${{ inputs.build_ventoy == true && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built KMOD
        uses: actions/download-artifact@v4
        with:
          name: geom_ventoy-64.ko.xz
      - name: Build Ventoy
        run: docker compose up
