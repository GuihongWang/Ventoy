name: Build BSD KMOD

on:
  workflow_dispatch:
    inputs:
      freebsd_iso_url:
        description: 'BSD ISO URL'
        required: true
        type: string
      build_ventoy:
        description: 'Build full Ventoy package after KMOD build'
        type: boolean
        default: true

jobs:
  build-kmod:
    runs-on: ubuntu-latest
    outputs:
      ventoy_version: ${{ steps.build.outputs.ventoy_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils sshpass mtools dosfstools genisoimage

      - name: Download ISO
        run: |
          echo "Downloading ISO from: ${{ inputs.freebsd_iso_url }}"
          curl -fSLo freebsd.iso "${{ inputs.freebsd_iso_url }}"
          ls -lh freebsd.iso
          # Extract version string from ISO label
          ISOLABEL=$(isoinfo -d -i freebsd.iso | grep "Volume id" | awk '{print $3}')
          echo "ISO label: $ISOLABEL"

      - name: Create disk image
        run: qemu-img create -f qcow2 disk.qcow2 12G

      - name: Create automated install config (FAT)
        run: |
          F=installerconfig
          echo '#!/bin/sh' > $F
          echo 'set -ex' >> $F
          echo 'exec 1>/dev/tty 2>/dev/tty' >> $F
          echo 'ROOTPW=ventoy' >> $F
          echo 'kbdcontrol -L /usr/share/syscons/keymaps/us.kbd' >> $F
          # Detect main disk (skip cd0, da0=USB config, fd0)
          echo 'DISK=$(sysctl -n kern.disks | tr " " "\n" | grep -v -e "^cd" -e "^da0$" -e "^fd" | head -1)' >> $F
          echo 'echo "Installing to disk: $DISK"' >> $F
          echo 'bsdinstall autopart ZFS $DISK' >> $F
          echo 'bsdinstall mount /mnt' >> $F
          echo 'bsdinstall distfetch /usr/freebsd-dist' >> $F
          echo 'bsdinstall distextract /mnt' >> $F
          printf '%s\n' 'cat >> /mnt/etc/rc.conf << EOF' >> $F
          echo 'hostname="ventoy-builder"' >> $F
          echo 'ifconfig_vtnet0="DHCP"' >> $F
          echo 'sshd_enable="YES"' >> $F
          echo 'EOF' >> $F
          printf '%s\n' "sed -i '' 's/^#PermitRootLogin.*/PermitRootLogin yes/' /mnt/etc/ssh/sshd_config" >> $F
          echo 'echo "$ROOTPW" | pw -R /mnt usermod root -h 0' >> $F
          echo 'cp /usr/share/zoneinfo/UTC /mnt/etc/localtime' >> $F
          echo 'echo '\''autoboot_delay="0"'\'' >> /mnt/boot/loader.conf' >> $F
          echo 'bsdinstall umount /mnt' >> $F
          echo 'zfs umount -a 2>/dev/null || true' >> $F
          echo 'poweroff' >> $F
          chmod +x $F
          # FAT image (FreeBSD installer looks for installerconfig on FAT)
          dd if=/dev/zero of=config.img bs=1k count=2880
          mkfs.msdos -F 12 config.img
          mcopy -i config.img installerconfig ::/
          mdir -i config.img
          ls -lh config.img

      - name: Install FreeBSD from ISO
        run: |
          KVM=",accel=kvm"
          if [ ! -e /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            KVM=",accel=tcg"
            echo "KVM not available, using TCG (slower)"
          fi

          echo "Starting automated installation (may take 5-15 min) ..."
          # config.img = FAT with installerconfig, attached as USB so FreeBSD mounts it as msdosfs
          timeout 900 qemu-system-x86_64 \
            -machine pc-q35-4.2${KVM} \
            -m 4096 \
            -cdrom freebsd.iso \
            -device qemu-xhci,id=xhci \
            -drive file=config.img,format=raw,if=none,id=config \
            -device usb-storage,drive=config \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -nic user,model=virtio-net-pci \
            -nographic -no-reboot 2>&1 | tee install.log || true
          echo "=== Install exit ==="
          tail -5 install.log

      - name: Boot and build kernel module
        id: build
        run: |
          # SSH key
          ssh-keygen -t rsa -f id_rsa -N '' -q
          mkdir -p ~/.ssh

          # Use KVM if available, otherwise fall back to TCG
          KVM=",accel=kvm"
          if [ ! -e /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            KVM=",accel=tcg"
            echo "KVM not available, using TCG (slower)"
          fi

          # Start VM from installed disk
          qemu-system-x86_64 \
            -machine pc-q35-4.2${KVM} \
            -m 4096 \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -nic user,model=virtio-net-pci,hostfwd=tcp::10022-:22 \
            -no-reboot -pidfile vm.pid -daemonize

          echo "Waiting for SSH ..."
          for i in $(seq 1 120); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i id_rsa root@localhost -p 10022 true 2>/dev/null; then
              echo "SSH ready after ${i}s"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "SSH timeout"
              kill $(cat vm.pid) 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          # Detect version
          echo "=== VM system ==="
          KVER=$(ssh -o StrictHostKeyChecking=no -i id_rsa \
            root@localhost -p 10022 uname -r)
          echo "Kernel: $KVER"

          case "$KVER" in
            15.*) VV="15.x" ;;
            14.*) VV="14.x" ;;
            13.*) VV="13.x" ;;
            12.*) VV="12.x" ;;
            11.*) VV="11.x" ;;
            10.*) VV="10.x" ;;
            9.*)  VV="9.x"  ;;
            *) echo "Unknown kernel: $KVER"; VV="" ;;
          esac
          echo "ventoy_version=$VV" >> $GITHUB_OUTPUT

          # Copy Ventoy source
          ssh -o StrictHostKeyChecking=no -i id_rsa \
            root@localhost -p 10022 mkdir -p /ventoy
          rsync -e "ssh -o StrictHostKeyChecking=no -i id_rsa -p 10022" \
            -a --rsync-path=/usr/bin/rsync \
            Unix/ root@localhost:/ventoy/Unix/

          # Install kernel source and build
          ssh -o StrictHostKeyChecking=no -i id_rsa \
            root@localhost -p 10022 "
            set -ex

            # Install kernel source
            if [ -f /usr/freebsd-dist/src.txz ]; then
              cd / && tar xJf /usr/freebsd-dist/src.txz
              echo 'Source from ISO'
            elif ! pkg install -y src 2>/dev/null; then
              VER=\$(uname -r | sed 's/-.*//')
              fetch \"https://download.freebsd.org/releases/amd64/\${VER}-RELEASE/src.txz\" \
                -o /tmp/src.txz
              cd / && tar xJf /tmp/src.txz
              echo 'Source downloaded'
            fi

            # Build
            VS=/ventoy/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/$VV
            if [ ! -d \"\$VS\" ]; then
              echo \"No source for $VV\"
              ls /ventoy/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/
              exit 1
            fi
            cp -r \"\$VS/sys/geom/ventoy\" /usr/src/sys/geom/ventoy
            mkdir -p /usr/src/sys/modules/geom/geom_ventoy
            cp \"\$VS/sys/modules/geom/geom_ventoy/Makefile\" /usr/src/sys/modules/geom/geom_ventoy/
            cd /usr/src/sys/modules/geom/geom_ventoy
            make -j\$(sysctl -n hw.ncpu)
            file geom_ventoy.ko
            xz -zf geom_ventoy.ko
          "

          # Copy artifact out
          mkdir -p "Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/$VV/64"
          scp -o StrictHostKeyChecking=no -i id_rsa -P 10022 \
            root@localhost:/usr/src/sys/modules/geom/geom_ventoy/geom_ventoy.ko.xz \
            "Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/$VV/64/"
          ls -la "Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/$VV/64/"

          # Shutdown
          ssh -o StrictHostKeyChecking=no -i id_rsa \
            root@localhost -p 10022 shutdown -p now 2>/dev/null || true
          sleep 3
          kill $(cat vm.pid) 2>/dev/null || true

      - name: Upload KMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: geom_ventoy-${{ steps.build.outputs.ventoy_version }}-64.ko.xz
          path: Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ steps.build.outputs.ventoy_version }}/64/geom_ventoy.ko.xz

  build-ventoy:
    needs: [build-kmod]
    if: ${{ inputs.build_ventoy == true && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built KMOD
        uses: actions/download-artifact@v4
        with:
          name: geom_ventoy-${{ needs.build-kmod.outputs.ventoy_version }}-64.ko.xz
          path: Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/
      - name: Build Ventoy
        run: docker compose up
