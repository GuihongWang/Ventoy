name: Build BSD KMOD

on:
  workflow_dispatch:
    inputs:
      freebsd_iso_url:
        description: 'BSD ISO URL (FreeBSD/pfSense/ClonOS/MidnightBSD etc.)'
        required: true
        type: string
      freebsd_version:
        description: 'Optional version override (e.g., 15.x, 14.x, 13.x). Leave empty to auto-detect.'
        required: false
        type: string
        default: ''
      build_ventoy:
        description: 'Build full Ventoy package after KMOD build'
        type: boolean
        default: true

jobs:
  build-kmod:
    runs-on: ubuntu-latest
    outputs:
      ventoy_version: ${{ steps.save-output.outputs.ventoy_version }}

    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # Step 1: Determine target FreeBSD version from user input/URL
      # ============================================================
      - name: Determine target FreeBSD version
        id: guess-version
        run: |
          if [ -n "${{ inputs.freebsd_version }}" ]; then
            VV="${{ inputs.freebsd_version }}"
            SRC_VER=$(echo "$VV" | sed 's/\.x//')
            echo "ventoy_version=$VV" >> $GITHUB_OUTPUT
            echo "src_ver=$SRC_VER" >> $GITHUB_OUTPUT
            echo "Using user-specified version: $VV"
            exit 0
          fi

          URL="${{ inputs.freebsd_iso_url }}"
          echo "ISO URL: $URL"

          # Match any version pattern like X.Y in URL
          # Handles: 15.0-RELEASE, 16.0-CURRENT, 14.1-STABLE, 13.2-BETA1, etc.
          V=""
          if [[ "$URL" =~ ([0-9]+\.[0-9]+)-RELEASE ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ ([0-9]+\.[0-9]+)-CURRENT ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ ([0-9]+\.[0-9]+)-STABLE ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ ([0-9]+\.[0-9]+)-BETA[0-9]* ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ ([0-9]+\.[0-9]+)-RC[0-9]* ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ /([0-9]+\.[0-9]+)/ ]]; then
            V="${BASH_REMATCH[1]}"
          fi

          if [ -n "$V" ]; then
            MAJOR="${V%%.*}"
            echo "ventoy_version=${MAJOR}.x" >> $GITHUB_OUTPUT
            echo "src_ver=$V" >> $GITHUB_OUTPUT
            echo "Parsed target version: ${MAJOR}.x from URL ($V)"
          else
            echo "ventoy_version=14.x" >> $GITHUB_OUTPUT
            echo "src_ver=14.1" >> $GITHUB_OUTPUT
            echo "URL parse failed, defaulting to 14.x"
          fi

      # ============================================================
      # Step 2: Build in FreeBSD VM
      # ============================================================
      - name: Build kernel module in FreeBSD VM
        id: build-vm
        uses: vmactions/freebsd-vm@v1
        with:
          # Try target version first, fallback to 14.1 if not available
          release: ${{ steps.guess-version.outputs.src_ver }}
          usesh: true
          sync: rsync
          mem: 4096
          prepare: pkg install -y rsync
          run: |
            set -ex
            REPO_DIR=$(pwd)

            # ============================================================
            # A. Detect the VM's running kernel version
            # ============================================================
            echo "========== VM SYSTEM DETECTION =========="
            uname -a
            KERNEL_VER=$(uname -r)
            OSDATE=$(sysctl -n kern.osreldate 2>/dev/null || echo "unknown")
            echo "Kernel release : $KERNEL_VER"
            echo "kern.osreldate: $OSDATE"

            case "$KERNEL_VER" in
              15.*) VM_VV="15.x"; VM_SRC_VER="15.0" ;;
              14.*) VM_VV="14.x"; VM_SRC_VER="14.1" ;;
              13.*) VM_VV="13.x"; VM_SRC_VER="13.3" ;;
              12.*) VM_VV="12.x"; VM_SRC_VER="12.4" ;;
              *)    VM_VV="";     VM_SRC_VER="" ;;
            esac
            echo "VM running version: $VM_VV (src: $VM_SRC_VER)"

            # Detect BSD distribution
            DISTRO="FreeBSD"
            if [ -f /etc/platform ]; then
              DISTRO=$(cat /etc/platform)
            elif [ -f /etc/version ]; then
              DISTRO=$(cat /etc/version | head -1)
            fi
            echo "Distribution: $DISTRO"

            # ============================================================
            # B. Resolve target Ventoy source version
            # ============================================================
            TARGET_VV="${{ steps.guess-version.outputs.ventoy_version }}"
            echo "Target version from host: $TARGET_VV"

            # Priority: Target VM detected version (user wanted)
            if [ -d "$REPO_DIR/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/$TARGET_VV" ]; then
              VV="$TARGET_VV"
              echo "Using target version: $VV (from URL/user input)"
            elif [ -n "$VM_VV" ] && [ -d "$REPO_DIR/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/$VM_VV" ]; then
              VV="$VM_VV"
              echo "Target version unavailable, using VM version: $VV"
            else
              echo "ERROR: No Ventoy source found for target=$TARGET_VV or VM=$VM_VV"
              echo "Available:"
              ls "$REPO_DIR/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/"
              exit 1
            fi
            VENTOY_SRC_DIR="$REPO_DIR/Unix/ventoy_unix_src/FreeBSD/geom_ventoy_src/$VV"
            echo "Using Ventoy source: $VENTOY_SRC_DIR"

            # ============================================================
            # C. Download kernel source for the TARGET version
            # ============================================================
            # Strategy: pkg install src > src.txz download > git fallback

            install_src_via_pkg() {
              echo "Trying: pkg install -y src"
              pkg install -y src 2>&1 && return 0
              # The package might be named differently
              pkg install -y freebsd-source 2>&1 && return 0
              pkg install -y base-source 2>&1 && return 0
              return 1
            }

            download_src_txz() {
              local URL="$1"
              echo "Trying: fetch $URL"
              fetch "$URL" -o /tmp/src.txz 2>/dev/null && {
                cd / && tar xJf /tmp/src.txz
                echo "Source extracted from $URL"
                return 0
              }
              return 1
            }

            echo "========== INSTALLING KERNEL SOURCE =========="

            # Method 1: pkg install src (best for matching VM release)
            NEED_DOWNLOAD=true
            if [ ! -f /usr/src/sys/sys/param.h ]; then
              if install_src_via_pkg; then
                NEED_DOWNLOAD=false
                echo "Source installed via pkg"
              fi
            else
              NEED_DOWNLOAD=false
              echo "Source already present"
            fi

            # Method 2: Download src.txz from various URLs
            if $NEED_DOWNLOAD; then
              echo "pkg failed, trying to download src.txz..."

              SUCCESS=false

              # Try from ISO URL's base directory
              ISO_URL="${{ inputs.freebsd_iso_url }}"
              BASE="${ISO_URL%/*}"
              download_src_txz "${BASE}/src.txz" && SUCCESS=true

              # Try official snapshot URL for CURRENT
              if ! $SUCCESS; then
                SNAP_VER=$(echo "$TARGET_VV" | sed 's/\.x//')
                download_src_txz "https://download.freebsd.org/snapshots/ISO-IMAGES/${SNAP_VER}/src.txz" && SUCCESS=true
              fi

              # Try official release URL
              if ! $SUCCESS; then
                for RV in \
                  "${{ steps.guess-version.outputs.src_ver }}-RELEASE" \
                  "${VM_SRC_VER}-RELEASE"; do
                  download_src_txz "https://download.freebsd.org/releases/amd64/${RV}/src.txz" && {
                    SUCCESS=true
                    break
                  }
                done
              fi

              if ! $SUCCESS; then
                echo "ERROR: All source download methods failed!"
                echo "Please specify freebsd_version manually, or use a valid ISO URL."
                exit 1
              fi
            fi

            # Verify source is available
            if [ ! -d /usr/src/sys/geom ]; then
              echo "ERROR: Kernel source not properly installed at /usr/src/sys"
              ls -la /usr/src/ 2>/dev/null || echo "/usr/src empty"
              exit 1
            fi
            echo "Kernel source ready at /usr/src"

            # ============================================================
            # D. Build geom_ventoy kernel module
            # ============================================================
            echo "========== INSTALLING VENTOY GEOM SOURCE =========="
            cp -r "$VENTOY_SRC_DIR/sys/geom/ventoy" /usr/src/sys/geom/ventoy
            mkdir -p /usr/src/sys/modules/geom/geom_ventoy
            cp "$VENTOY_SRC_DIR/sys/modules/geom/geom_ventoy/Makefile" /usr/src/sys/modules/geom/geom_ventoy/

            echo "========== BUILDING KERNEL MODULE =========="
            cd /usr/src/sys/modules/geom/geom_ventoy
            make -j$(sysctl -n hw.ncpu)

            echo "========== BUILD RESULT =========="
            file geom_ventoy.ko

            # ============================================================
            # E. Install to repo directory (synced back to host)
            # ============================================================
            echo "========== INSTALLING =========="
            TARGET_DIR="$REPO_DIR/Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/$VV/64"
            mkdir -p "$TARGET_DIR"
            cp geom_ventoy.ko "$TARGET_DIR/"
            cd "$TARGET_DIR"
            xz -zf geom_ventoy.ko
            ls -la "$TARGET_DIR/"

            # Save detected version for host-side reading
            echo "$VV" > "$REPO_DIR/Unix/.detected_version"

      # ============================================================
      # Step 3: Read back detected version from synced output
      # ============================================================
      - name: Read detected version
        id: save-output
        run: |
          if [ -f Unix/.detected_version ]; then
            VV=$(cat Unix/.detected_version)
            echo "ventoy_version=$VV" >> $GITHUB_OUTPUT
            echo "Detected version from VM: $VV"
          else
            VV="${{ steps.guess-version.outputs.ventoy_version }}"
            echo "ventoy_version=$VV" >> $GITHUB_OUTPUT
            echo "Using fallback version: $VV"
          fi

      # ============================================================
      # Step 4: Upload .ko.xz as artifact
      # ============================================================
      - name: Upload KMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: geom_ventoy-${{ steps.save-output.outputs.ventoy_version }}-64.ko.xz
          path: Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ steps.save-output.outputs.ventoy_version }}/64/geom_ventoy.ko.xz

  # ================================================================
  # Build full Ventoy package (optional)
  # ================================================================
  build-ventoy:
    needs: [build-kmod]
    if: ${{ inputs.build_ventoy == true && !cancelled() && !failure() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download built KMOD
        uses: actions/download-artifact@v4
        with:
          name: geom_ventoy-${{ needs.build-kmod.outputs.ventoy_version }}-64.ko.xz
          path: Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/

      - name: Verify KMOD in place
        run: |
          ls -la Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/
          file Unix/ventoy_unix/FreeBSD/geom_ventoy_ko/${{ needs.build-kmod.outputs.ventoy_version }}/64/geom_ventoy.ko.xz

      - name: Build Ventoy
        run: docker compose up

      - name: Upload Ventoy artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ventoy-build-output
          path: INSTALL/ventoy-*
